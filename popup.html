<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Compactar texto</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; margin: 12px; }
    label { font-size: 12px; color: #555; display: block; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 14px; font-family: monospace; }
    #output { background: #f3f3f3; }
    button { margin-top: 10px; width: 100%; padding: 8px; font-size: 14px; cursor: pointer; }
    #status { font-size: 12px; color: #2a7d2a; height: 16px; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <label for="input">Texto original</label>
  <input id="input" type="text" placeholder="eee-222-eee" autofocus>

  <label for="output">Resultado</label>
  <input id="output" type="text" readonly>

  <button id="copy">Copiar y cerrar (Enter)</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
